<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon-dark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Imronbek — Aspiring Software Engineer & Frontend Developer. Exploring React, JavaScript, and modern creative web architecture." />
    <meta name="keywords" content="Imronbek, Software Engineer, Frontend Developer, React, JavaScript, Portfolio, Fergana State Technical University" />
    <meta name="author" content="Imronbek" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Imronbek — Software Engineer & Frontend Developer" />
    <meta property="og:description" content="Personal developer portfolio showcasing modern web applications, frontend architecture, and technical projects." />

    <title>Imronbek — Software Engineer & Frontend Developer</title>

    <!-- Prevent flash of incorrect theme & favicon on load -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
          var favicon = document.getElementById('favicon');
          if (favicon) {
            favicon.setAttribute('href', theme === 'dark' ? '/favicon-dark.svg' : '/favicon-light.svg');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Syne (Editorial Display), Plus Jakarta Sans (Clean Modern Body), JetBrains Mono (Tech/Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#05060A] text-slate-800 dark:text-slate-100 selection:bg-indigo-500/30 selection:text-indigo-600 dark:selection:text-indigo-200 antialiased overflow-x-hidden">
    <!-- Netlify Forms Detection (Static definition for React SPA) -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF3F9"/>
    </linearGradient>

    <!-- Subtle Light Aura Accents -->
    <radialGradient id="lightPurpleAura" cx="48%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lightBlueAura" cx="75%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Orbit Top Gradient: Rich Purple to Deep Indigo -->
    <linearGradient id="topOrbitLightGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Orbit Bottom Gradient: Rich Violet through Royal Blue & Cyan -->
    <linearGradient id="bottomOrbitLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="35%" stop-color="#1D4ED8"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>

    <!-- Monogram I Gradient for Light Mode (Deep Navy to Purple at bottom) -->
    <linearGradient id="iLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090D26"/>
      <stop offset="55%" stop-color="#090D26"/>
      <stop offset="85%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Subtle Crisp Shadow for Light Mode -->
    <filter id="softCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="36" y="36" width="440" height="440" rx="116" ry="116" fill="url(#lightBg)" stroke="rgba(0,0,0,0.06)" stroke-width="3" filter="url(#softCardShadow)"/>
  <rect x="36" y="36" width="440" height="440" rx="116" ry="116" fill="url(#lightPurpleAura)"/>
  <rect x="36" y="36" width="440" height="440" rx="116" ry="116" fill="url(#lightBlueAura)"/>

  <!-- Orbit Top Arc (Rich Purple to Deep Indigo) -->
  <path d="M 124 210 C 136 142 190 98 258 98 C 304 98 344 116 366 142"
        fill="none" stroke="url(#topOrbitLightGrad)" stroke-width="15" stroke-linecap="round"/>

  <!-- Orbit Bottom Arc & Comet Tail (Violet to Electric Cyan) -->
  <path d="
    M 132 308
    C 158 370 212 404 274 404
    C 334 404 382 370 398 316
    C 403 300 405 284 406 266
    C 404 286 397 312 376 338
    C 350 370 310 388 266 388
    C 214 388 168 358 142 320
    Z
  " fill="url(#bottomOrbitLightGrad)"/>

  <!-- 4-Point Diamond Sparkle (Dark Navy/Blue) -->
  <path d="
    M 382 136
    Q 382 172 418 172
    Q 382 172 382 208
    Q 382 172 346 172
    Q 382 172 382 136
    Z
  " fill="#090D26"/>

  <!-- Center Monogram 'IG' with Shear Matrix Transform -->
  <g transform="matrix(1 0 -0.32 1 106 0)">
    <!-- Letter 'I' -->
    <path d="
      M 148 194
      L 188 194
      Q 192 194 192 198
      L 192 328
      Q 192 332 188 332
      L 148 332
      Q 144 332 144 328
      L 144 198
      Q 144 194 148 194
      Z
    " fill="url(#iLightGrad)"/>

    <!-- Letter 'G' -->
    <path fill-rule="evenodd" d="
      M 230 194
      L 348 194
      Q 352 194 352 198
      L 352 230
      Q 352 234 348 234
      L 262 234
      Q 256 234 256 240
      L 256 286
      Q 256 292 262 292
      L 310 292
      L 310 270
      Q 310 266 314 266
      L 348 266
      Q 352 266 352 270
      L 352 328
      Q 352 332 346 332
      L 230 332
      Q 216 332 216 318
      L 216 208
      Q 216 194 230 194
      Z
    " fill="#090D26"/>
  </g>
</svg>
